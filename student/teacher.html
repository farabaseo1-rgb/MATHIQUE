
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHIQUE | Teacher Learning Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F5F0E5;
            color: #405447;
        }

        header {
            background: #718C78;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }

        main {
            max-width: 1100px;
            margin: 65px auto;
            padding: 0 25px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 55px;
        }

        .teacher-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #718C78;
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #718C78;
            font-size: 16px;
        }

        .learning-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }

        .option {
            background: #718C78;
            color: white;
            text-decoration: none;
            padding: 35px 18px;
            border-radius: 18px;
            text-align: center;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease;
            box-shadow: 0 5px 12px rgba(0,0,0,0.10);
        }

        .option:hover {
            transform: translateY(-7px);
            background: #5D7764;
        }

        .symbol {
            font-size: 55px;
            margin-bottom: 22px;
        }

        .option h3 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .option p {
            font-size: 14px;
            line-height: 1.6;
            color: #F5F0E5;
        }

        .back {
            display: inline-block;
            margin-top: 45px;
            color: #405447;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .learning-options {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .option {
                padding: 22px 12px;
                min-height: 165px;
                border-radius: 12px;
            }

            .symbol {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .option h3 {
                font-size: 16px;
            }

            .option p {
                font-size: 12px;
            }

            .welcome h2 {
                font-size: 24px;
            }

            .teacher-photo {
                width: 125px;
                height: 125px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MATHIQUE</h1>
</header>

<main>

    <section class="welcome">

        <img id="teacherPhoto"
             class="teacher-photo"
             src="../assets/images/rochelle_profile.jpg"
             alt="Teacher Profile">

        <h2 id="teacherName">Welcome, Student!</h2>

        <p>Choose a learning section to begin.</p>

    </section>

    <section class="learning-options">

        <a class="option" id="modulesLink" href="modules.html">
            <div class="symbol">📚</div>
            <h3>LEARNING MODULES</h3>
            <p>Explore weekly lessons and learning materials.</p>
        </a>

        <a class="option" id="mockTestLink" href="mock-test.html">
            <div class="symbol">📝</div>
            <h3>MOCK TEST</h3>
            <p>Test your knowledge and practice your skills.</p>
        </a>

        <a class="option" id="videosLink" href="videos.html">
            <div class="symbol">🎬</div>
            <h3>VIDEO TUTORIALS</h3>
            <p>Watch video lessons through teacher-provided links.</p>
        </a>

    </section>

    <a class="back" href="dashboard.html">← Back to Teachers</a>

</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const teacher = params.get("teacher");

    const teachers = {
        josephine: {
            name: "Josephine H. Lapuz",
            image: "../assets/images/josephine.jpg"
        },

        maria: {
            name: "Maria Pauline B. Gonzales",
            image: "../assets/images/maria.jpg"
        },

        rochelle: {
            name: "Rochelle R. Carpio",
            image: "../assets/images/rochelle_profile.jpg"
        }
    };

    const selectedTeacher = teachers[teacher];

    if (selectedTeacher) {
        document.getElementById("teacherName").textContent =
            "Welcome, " + selectedTeacher.name + "!";

        document.getElementById("teacherPhoto").src =
            selectedTeacher.image;
    } else {
        document.getElementById("teacherName").textContent =
            "Welcome, Student!";

        document.getElementById("teacherPhoto").style.display = "none";
    }

    const teacherParameter = "?teacher=" +
        encodeURIComponent(teacher || "");

    document.getElementById("modulesLink").href =
        "modules.html" + teacherParameter;

    document.getElementById("mockTestLink").href =
        "mock-test.html" + teacherParameter;

    document.getElementById("videosLink").href =
        "videos.html" + teacherParameter;
</script>

</body>
</html>
