
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHIQUE | Student Profile</title>

    <link rel="stylesheet" href="../assets/css/student_dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .profile-container {
            max-width: 850px;
            margin: 25px auto;
            background: #fffef8;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(41, 75, 56, 0.08);
        }

        .profile-heading {
            margin-bottom: 25px;
        }

        .profile-heading h1 {
            color: #294b38;
            font-size: 25px;
        }

        .profile-heading p {
            color: #718071;
            font-size: 13px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 22px;
            padding-bottom: 25px;
            border-bottom: 1px solid #dce5d7;
            margin-bottom: 25px;
        }

        .profile-photo {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: #dce7d5;
            color: #294b38;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 700;
            overflow: hidden;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-top h2 {
            color: #294b38;
            font-size: 19px;
        }

        .profile-top p {
            color: #718071;
            font-size: 13px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .detail-group label {
            display: block;
            color: #526653;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .detail-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce5d7;
            border-radius: 8px;
            background: #f7f8f2;
            color: #354b3c;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .detail-group input:disabled {
            cursor: default;
        }

        .detail-group input:focus {
            border-color: #879b83;
        }

        .role-label {
            display: inline-block;
            background: #dce7d5;
            color: #294b38;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .profile-actions button {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-btn, .save-btn {
            background: #294b38;
            color: white;
        }

        .cancel-btn {
            background: #e5eadf;
            color: #354b3c;
        }

        .photo-upload {
            display: none;
            margin-top: 10px;
            font-size: 11px;
        }

        #statusMessage {
            margin-top: 15px;
            color: #294b38;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .profile-container {
                padding: 22px 16px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }

            .profile-photo {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="student-profile">
            <div class="student-photo" id="sidebarInitial">S</div>
            <h3 id="sidebarName">Loading...</h3>
            <a href="profile.html" class="view-profile">View Profile</a>
        </div>

        <h2 class="logo">MATHIQUE</h2>
        <p class="logo-subtitle">MATHEMATICS LEARNING DATABASE</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="teacher.html">Our Teachers</a>
            <a href="select-teacher.html?section=modules">Learning Modules</a>
            <a href="select-teacher.html?section=mock-test">Mock Test</a>
            <a href="select-teacher.html?section=videos">Video Tutorials</a>
        </nav>

        <a href="../index.html" class="logout">Log Out</a>

    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>My Profile</h1>
                <p>Manage your student account</p>
            </div>
        </header>

        <section class="profile-container">

            <div class="profile-heading">
                <h1>Student Information</h1>
                <p>View and manage your account information.</p>
            </div>

            <div class="profile-top">

                <div class="profile-photo" id="profilePhoto">S</div>

                <div>
                    <h2 id="displayName">Loading...</h2>
                    <p>Student Account</p>

                    <input
                        type="file"
                        id="photoInput"
                        class="photo-upload"
                        accept="image/*"
                        disabled
                    >
                </div>

            </div>

            <form id="profileForm">

                <div class="profile-details">

                    <div class="detail-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" disabled>
                    </div>

                    <div class="detail-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" disabled>
                    </div>

                    <div class="detail-group">
                        <label for="username">Username</label>
                        <input type="text" id="username"
                            placeholder="Enter username" disabled>
                    </div>

                    <div class="detail-group">
                        <label for="gradeSection">Grade &amp; Section</label>
                        <input type="text" id="gradeSection"
                            placeholder="Enter grade and section" disabled>
                    </div>

                    <div class="detail-group">
                        <label>Account Role</label>
                        <span class="role-label">Student</span>
                    </div>

                </div>

                <div class="profile-actions">

                    <button type="button" class="edit-btn" id="editBtn">
                        Edit Profile
                    </button>

                    <button type="submit" class="save-btn" id="saveBtn" hidden>
                        Save Changes
                    </button>

                    <button type="button" class="cancel-btn" id="cancelBtn" hidden>
                        Cancel
                    </button>

                </div>

                <p id="statusMessage"></p>

            </form>

        </section>

    </main>

    <script type="module">
        import { supabase } from '../js/supabase.js';

        const fields = [
            'fullName',
            'email',
            'username',
            'gradeSection'
        ];

        const form = document.getElementById('profileForm');
        const editBtn = document.getElementById('editBtn');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const photoInput = document.getElementById('photoInput');
        const profilePhoto = document.getElementById('profilePhoto');
        const displayName = document.getElementById('displayName');
        const statusMessage = document.getElementById('statusMessage');
        const sidebarName = document.getElementById('sidebarName');
        const sidebarInitial = document.getElementById('sidebarInitial');

        let currentUser = null;
        let originalValues = {};

        function updateNames(name) {
            const safeName = name || 'Student Name';
            const initial = safeName !== 'Student Name'
                ? safeName.charAt(0).toUpperCase()
                : 'S';

            displayName.textContent = safeName;
            sidebarName.textContent = safeName;
            sidebarInitial.textContent = initial;

            if (!profilePhoto.querySelector('img')) {
                profilePhoto.textContent = initial;
            }
        }

        async function loadProfile() {
            const { data: { session }, error: sessionError } =
                await supabase.auth.getSession();

            if (sessionError || !session) {
                alert('Please log in first.');
                window.location.href = '../index.html';
                return;
            }

            currentUser = session.user;

            const { data: profile, error } = await supabase
                .from('profiles')
                .select('full_name, email, role')
                .eq('user_id', currentUser.id)
                .single();

            if (error) {
                console.error(error);
                statusMessage.textContent =
                    'Unable to load profile: ' + error.message;
                return;
            }

            if (profile.role !== 'student') {
                alert('Student access only.');
                window.location.href = '../index.html';
                return;
            }

            const savedLocal = JSON.parse(
                localStorage.getItem('mathiqueStudentProfile') || 'null'
            ) || {};

            document.getElementById('fullName').value =
                profile.full_name || '';

            document.getElementById('email').value =
                profile.email || currentUser.email || '';

            document.getElementById('username').value =
                savedLocal.username || '';

            document.getElementById('gradeSection').value =
                savedLocal.gradeSection || '';

            updateNames(profile.full_name || 'Student Name');
        }

        function startEditing() {
            originalValues = {};

            fields.forEach(id => {
                const field = document.getElementById(id);
                originalValues[id] = field.value;
                field.disabled = false;
            });

            document.getElementById('email').disabled = true;

            photoInput.disabled = false;
            photoInput.style.display = 'block';

            editBtn.hidden = true;
            saveBtn.hidden = false;
            cancelBtn.hidden = false;

            statusMessage.textContent = '';
        }

        function stopEditing() {
            fields.forEach(id => {
                document.getElementById(id).disabled = true;
            });

            photoInput.disabled = true;
            photoInput.style.display = 'none';

            editBtn.hidden = false;
            saveBtn.hidden = true;
            cancelBtn.hidden = true;
        }

        editBtn.addEventListener('click', startEditing);

        cancelBtn.addEventListener('click', () => {
            fields.forEach(id => {
                document.getElementById(id).value = originalValues[id] || '';
            });

            updateNames(originalValues.fullName || 'Student Name');

            stopEditing();
            statusMessage.textContent = 'Changes cancelled.';
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            const name = document.getElementById('fullName').value.trim();

            if (!name) {
                statusMessage.textContent = 'Please enter your full name.';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            statusMessage.textContent = 'Saving your profile...';

            const { error } = await supabase
                .from('profiles')
                .update({
                    full_name: name
                })
                .eq('user_id', currentUser.id);

            if (error) {
                console.error(error);
                statusMessage.textContent =
                    'Could not save name: ' + error.message;

                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                return;
            }

            const profileData = {
                fullName: name,
                email: document.getElementById('email').value,
                username: document.getElementById('username').value.trim(),
                gradeSection: document.getElementById('gradeSection').value.trim()
            };

            localStorage.setItem(
                'mathiqueStudentProfile',
                JSON.stringify(profileData)
            );

            updateNames(name);

            stopEditing();

            statusMessage.textContent =
                'Profile updated successfully!';

            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
        });

        photoInput.addEventListener('change', () => {
            const file = photoInput.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = event => {
                profilePhoto.innerHTML = '';

                const img = document.createElement('img');
                img.src = event.target.result;

                profilePhoto.appendChild(img);
            };

            reader.readAsDataURL(file);
        });

        loadProfile();
    </script>

</body>
</html>
