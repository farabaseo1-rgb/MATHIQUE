
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHIQUE | Learning Modules</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #edf1e8;
            color: #354b3c;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            color: #294b38;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .header {
            background: #294b38;
            color: #fffef8;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            color: #e5ecdf;
            line-height: 1.6;
        }

        .week-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .week-card {
            background: #fffef8;
            border: 1px solid #dce5d8;
            border-radius: 14px;
            overflow: hidden;
        }

        .week-button {
            width: 100%;
            border: none;
            background: #fffef8;
            color: #294b38;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
        }

        .week-button:hover {
            background: #e8efe5;
        }

        .week-button h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .week-button p {
            color: #718675;
            font-size: 13px;
        }

        .arrow {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .week-button[aria-expanded="true"] .arrow {
            transform: rotate(180deg);
        }

        .lesson-list {
            display: none;
            padding: 0 25px 25px;
        }

        .lesson-list.open {
            display: block;
        }

        .lesson {
            background: #edf1e8;
            padding: 17px 20px;
            border-radius: 10px;
            margin-top: 12px;
            border-left: 4px solid #718c78;
        }

        .lesson h3 {
            color: #294b38;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .lesson p {
            color: #68796b;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message {
            background: #fffef8;
            border: 1px solid #dce5d8;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            color: #68796b;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            .header {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .week-button {
                padding: 20px;
            }

            .week-button h2 {
                font-size: 17px;
            }

            .lesson-list {
                padding: 0 18px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back-link" href="dashboard.html">
        ← Back to Student Dashboard
    </a>

    <div class="header">
        <h1>Learning Modules</h1>
        <p>
            Explore the weekly lessons prepared by your mathematics teacher.
            Select a week to view its lessons.
        </p>
    </div>

    <div class="week-list" id="weekList">
        <div class="message">Loading learning modules...</div>
    </div>

</div>

<script type="module">
    import { supabase } from '../js/supabase.js';

    const weekList = document.getElementById('weekList');

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[character]);
    }

    async function loadModules() {
        try {
            const { data: sessionData, error: sessionError } =
                await supabase.auth.getSession();

            if (sessionError) throw sessionError;

            const user = sessionData.session?.user;

            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('role')
                .eq('user_id', user.id)
                .single();

            if (profileError) throw profileError;

            if (profile.role !== 'student') {
                weekList.innerHTML =
                    '<div class="message">This page is for student accounts only.</div>';
                return;
            }

            const { data: modules, error: modulesError } = await supabase
                .from('modules')
                .select(`
                    id,
                    title,
                    week_number,
                    description,
                    lessons (
                        id,
                        title,
                        content,
                        position
                    )
                `)
                .eq('is_published', true)
                .order('week_number', { ascending: true });

            if (modulesError) throw modulesError;

            displayModules(modules || []);

        } catch (error) {
            console.error('Error loading modules:', error);

            weekList.innerHTML = `
                <div class="message">
                    Unable to load learning modules.
                    <br>
                    Please try again later.
                    <br><br>
                    <small>${escapeHTML(error.message)}</small>
                </div>
            `;
        }
    }

    function displayModules(modules) {
        weekList.innerHTML = '';

        if (modules.length === 0) {
            weekList.innerHTML = `
                <div class="message">
                    No published learning modules yet.
                    <br>
                    Please check again later.
                </div>
            `;
            return;
        }

        modules.forEach(module => {
            const lessons = (module.lessons || []).sort(
                (a, b) => (a.position || 0) - (b.position || 0)
            );

            const card = document.createElement('div');
            card.className = 'week-card';

            const lessonHTML = lessons.length > 0
                ? lessons.map(lesson => `
                    <div class="lesson">
                        <h3>${escapeHTML(lesson.title)}</h3>
                        <p>${escapeHTML(lesson.content || 'No lesson content provided yet.')}</p>
                    </div>
                `).join('')
                : '<div class="message">No lessons added to this week yet.</div>';

            card.innerHTML = `
                <button class="week-button"
                        type="button"
                        aria-expanded="false"
                        aria-controls="lessons-${escapeHTML(module.id)}">
                    <div>
                        <h2>Week ${escapeHTML(module.week_number)}: ${escapeHTML(module.title)}</h2>
                        <p>${escapeHTML(module.description || 'View the lessons for this week')}</p>
                    </div>
                    <span class="arrow">⌄</span>
                </button>

                <div class="lesson-list" id="lessons-${escapeHTML(module.id)}">
                    ${lessonHTML}
                </div>
            `;

            const button = card.querySelector('.week-button');
            const lessonList = card.querySelector('.lesson-list');

            button.addEventListener('click', () => {
                const isOpen = button.getAttribute('aria-expanded') === 'true';

                button.setAttribute('aria-expanded', String(!isOpen));
                lessonList.classList.toggle('open', !isOpen);
            });

            weekList.appendChild(card);
        });
    }

    loadModules();
</script>

</body>
</html>
