<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATHIQUE | Student Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #F5F0E5;
      color: #34483B;
      min-height: 100vh;
    }

    header {
      background: #718C78;
      color: #FFF9EC;
      padding: 22px 7%;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    main {
      padding: 50px 7%;
    }

    .welcome h2 {
      color: #718C78;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #69736A;
      margin-bottom: 35px;
    }

    .section-title {
      color: #526B58;
      font-size: 21px;
      margin-bottom: 20px;
    }

    .teacher-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .teacher-card {
      background: #718C78;
      color: #FFF9EC;
      border-radius: 14px;
      padding: 30px 18px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .teacher-card:hover {
      transform: translateY(-5px);
      background: #607B67;
    }

    .teacher-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .teacher-card h3 {
      font-size: 17px;
      margin-bottom: 9px;
      line-height: 1.4;
    }

    .teacher-card p {
      font-size: 14px;
      color: #F5F0E5;
    }

    @media (max-width: 700px) {
      .teacher-cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MATHIQUE</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome, Student!</h2>
      <p>Your Mathematics Learning Dashboard</p>
    </section>

    <h3 class="section-title">Select Your Teacher</h3>

    <section class="teacher-cards">

      <a href="teacher.html?teacher=josephine" class="teacher-card">
        <div class="teacher-icon">👤</div>
        <h3>Josephine H. Lapuz</h3>
        <p>Teacher V</p>
      </a>

      <a href="teacher.html?teacher=maria" class="teacher-card">
        <div class="teacher-icon">👤</div>
        <h3>Maria Pauline B. Gonzales</h3>
        <p>Teacher III</p>
      </a>

      <a href="teacher.html?teacher=rochelle" class="teacher-card">
        <div class="teacher-icon">👤</div>
        <h3>Rochelle R. Carpio</h3>
        <p>Teacher III</p>
      </a>

    </section>
  </main>

</body>
</html>
