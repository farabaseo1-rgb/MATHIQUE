
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHIQUE | Upload Mock Test</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px;
            font-family: 'Poppins', sans-serif;
            background: #edf1e8;
            color: #354b3c;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .back {
            color: #294b38;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: #fffef8;
            padding: 25px;
            margin-top: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }

        h1, h2 { color: #294b38; }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd8c9;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #294b38;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .note {
            color: #718174;
            font-size: 13px;
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back" href="dashboard.html">← Back to Dashboard</a>

    <h1>Upload Mock Test</h1>
    <p>Upload your prepared questionnaire and its separate answer key.</p>

    <div class="card">
        <form id="uploadForm">

            <label for="testTitle">Mock Test Title</label>
            <input
                type="text"
                id="testTitle"
                placeholder="Example: Week 1 Mathematics Mock Test"
                required
            >

            <label for="questionnaire">Questionnaire PDF</label>
            <input
                type="file"
                id="questionnaire"
                accept=".pdf,application/pdf"
                required
            >
            <p class="note">PDF containing questions and choices.</p>

            <label for="answerKey">Answer Key PDF</label>
            <input
                type="file"
                id="answerKey"
                accept=".pdf,application/pdf"
                required
            >
            <p class="note">Separate PDF containing correct answers.</p>

            <button type="submit" id="uploadButton">
                Upload PDF Files
            </button>

            <p id="message" role="status"></p>
        </form>
    </div>

</div>

<script type="module">
import { supabase } from '../js/supabase.js';

const form = document.getElementById('uploadForm');
const button = document.getElementById('uploadButton');
const message = document.getElementById('message');

const bucket = 'mock-test-pdfs';

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const title = document.getElementById('testTitle').value.trim();
    const questionnaire = document.getElementById('questionnaire').files[0];
    const answerKey = document.getElementById('answerKey').files[0];

    if (!title || !questionnaire || !answerKey) {
        message.textContent = 'Please complete all fields.';
        return;
    }

    if (
        questionnaire.type !== 'application/pdf' ||
        answerKey.type !== 'application/pdf' ||
        !questionnaire.name.toLowerCase().endsWith('.pdf') ||
        !answerKey.name.toLowerCase().endsWith('.pdf')
    ) {
        message.textContent = 'Please select PDF files only.';
        return;
    }

    const { data: { session }, error: sessionError } =
        await supabase.auth.getSession();

    if (sessionError || !session) {
        message.textContent = 'Please log in first.';
        return;
    }

    const user = session.user;

    const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('user_id', user.id)
        .single();

    if (profileError || profile?.role !== 'teacher') {
        message.textContent = 'Teacher access only.';
        return;
    }

    button.disabled = true;
    button.textContent = 'Uploading...';
    message.textContent = 'Please wait while your files are uploaded.';

    const uploadId = crypto.randomUUID();
    const folder = `${user.id}/${uploadId}`;

    const questionnairePath = `${folder}/questionnaire.pdf`;
    const answerKeyPath = `${folder}/answer-key.pdf`;

    let uploadedQuestionnaire = false;
    let uploadedAnswerKey = false;

    try {
        const { error: questionError } = await supabase.storage
            .from(bucket)
            .upload(questionnairePath, questionnaire, {
                contentType: 'application/pdf',
                upsert: false
            });

        if (questionError) throw questionError;
        uploadedQuestionnaire = true;

        const { error: answerError } = await supabase.storage
            .from(bucket)
            .upload(answerKeyPath, answerKey, {
                contentType: 'application/pdf',
                upsert: false
            });

        if (answerError) throw answerError;
        uploadedAnswerKey = true;

        const { error: recordError } = await supabase
            .from('mock_test_uploads')
            .insert({
                teacher_id: user.id,
                title: title,
                questionnaire_path: questionnairePath,
                answer_key_path: answerKeyPath,
                status: 'pending'
            });

        if (recordError) throw recordError;

        message.textContent =
            'Success! Both PDFs were uploaded. Your mock test is pending review.';

        form.reset();

    } catch (error) {
        if (uploadedQuestionnaire || uploadedAnswerKey) {
            const paths = [];

            if (uploadedQuestionnaire) paths.push(questionnairePath);
            if (uploadedAnswerKey) paths.push(answerKeyPath);

            await supabase.storage.from(bucket).remove(paths);
        }

        message.textContent = 'Upload failed: ' + error.message;

    } finally {
        button.disabled = false;
        button.textContent = 'Upload PDF Files';
    }
});
</script>

</body>
</html>
