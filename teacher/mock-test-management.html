
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MATHIQUE | Mock Test Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e9efe8;
            color: #294536;
            padding: 30px 16px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        header {
            background: #294b38;
            color: #fffef8;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            opacity: .9;
        }

        .section-title {
            margin-bottom: 15px;
            font-size: 20px;
        }

        #testList {
            display: grid;
            gap: 15px;
        }

        .test-card,
        .details-card {
            background: #fffef8;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .test-card h3 {
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .test-info {
            font-size: 13px;
            color: #64766a;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .draft {
            background: #fff0cf;
            color: #8a5b12;
        }

        .published {
            background: #dcefe0;
            color: #28613b;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            margin: 3px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .publish-btn {
            background: #416b4e;
            color: white;
        }

        .view-btn {
            background: #dce8dc;
            color: #294b38;
        }

        .refresh-btn,
        .back-btn {
            background: #dce8dc;
            color: #294b38;
        }

        #message {
            margin: 15px 0;
            font-size: 14px;
        }

        .empty {
            background: #fffef8;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            color: #64766a;
        }

        #testDetails {
            display: none;
            margin-top: 25px;
        }

        .details-header {
            margin-bottom: 20px;
        }

        .details-header h2 {
            margin: 12px 0 5px;
            overflow-wrap: anywhere;
        }

        .question-card {
            background: #f3f6f0;
            border: 1px solid #dce8dc;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .question-card h4 {
            margin-bottom: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .choice {
            padding: 8px 10px;
            margin: 6px 0;
            background: #fffef8;
            border-radius: 7px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .correct-answer {
            color: #28613b;
            font-weight: 700;
            margin-top: 12px;
            font-size: 13px;
        }

        .details-message {
            margin: 15px 0;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }

            .test-card,
            .details-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>MATHIQUE</h1>
        <p>Teacher Mock Test Management</p>
    </header>

    <section id="listSection">

        <h2 class="section-title">My Mock Tests</h2>

        <button class="refresh-btn" id="refreshButton" type="button">
            Refresh Tests
        </button>

        <p id="message">Loading mock tests...</p>

        <div id="testList"></div>

    </section>

    <section id="testDetails">

        <button class="back-btn" id="backButton" type="button">
            ← Back to Mock Tests
        </button>

        <div class="details-card">

            <div class="details-header">
                <span id="detailsStatus" class="status"></span>
                <h2 id="detailsTitle"></h2>
                <p id="detailsInfo" class="test-info"></p>
            </div>

            <h3>Questionnaire and Answer Key</h3>

            <p id="detailsMessage" class="details-message"></p>

            <div id="questionList"></div>

        </div>

    </section>

</div>

<script type="module">

    import { supabase } from '../js/supabase.js';

    const testList = document.getElementById('testList');
    const message = document.getElementById('message');
    const refreshButton = document.getElementById('refreshButton');

    const listSection = document.getElementById('listSection');
    const testDetails = document.getElementById('testDetails');

    const backButton = document.getElementById('backButton');
    const detailsTitle = document.getElementById('detailsTitle');
    const detailsStatus = document.getElementById('detailsStatus');
    const detailsInfo = document.getElementById('detailsInfo');
    const detailsMessage = document.getElementById('detailsMessage');
    const questionList = document.getElementById('questionList');

    let currentUser = null;

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[character]);
    }

    async function checkAccess() {

        const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        currentUser = sessionData.session?.user;

        if (!currentUser) {
            message.textContent = 'Please log in first.';
            return false;
        }

        const { data: profile, error } = await supabase
            .from('profiles')
            .select('role, is_developer')
            .eq('user_id', currentUser.id)
            .single();

        if (error) throw error;

        if (
            profile.role !== 'teacher' &&
            profile.is_developer !== true
        ) {
            message.textContent = 'Access denied. Teacher access only.';
            return false;
        }

        return true;
    }

    async function loadTests() {

        testList.innerHTML = '';
        message.textContent = 'Loading mock tests...';

        try {

            const allowed = await checkAccess();

            if (!allowed) return;

            const { data: tests, error } = await supabase
                .from('pdf_mock_tests')
                .select(`
                    id,
                    title,
                    status,
                    created_at,
                    pdf_mock_test_questions(count)
                `)
                .eq('teacher_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!tests || tests.length === 0) {

                message.textContent = '';

                testList.innerHTML = `
                    <div class="empty">
                        No saved mock tests yet.
                    </div>
                `;

                return;
            }

            message.textContent = '';

            tests.forEach(test => {

                const questionCount =
                    test.pdf_mock_test_questions?.[0]?.count ?? 0;

                const isPublished = test.status === 'published';

                const card = document.createElement('div');

                card.className = 'test-card';

                card.innerHTML = `
                    <span class="status ${isPublished ? 'published' : 'draft'}">
                        ${isPublished ? 'PUBLISHED' : 'DRAFT'}
                    </span>

                    <h3>${escapeHTML(test.title)}</h3>

                    <p class="test-info">
                        Questions: ${questionCount}<br>
                        Created: ${new Date(test.created_at).toLocaleDateString()}
                    </p>

                    <button
                        type="button"
                        class="view-btn"
                        data-action="view"
                        data-id="${escapeHTML(test.id)}">
                        View Test
                    </button>

                    ${
                        isPublished
                        ? '<p class="test-info">This test is published for students.</p>'
                        : `
                            <button
                                type="button"
                                class="publish-btn"
                                data-action="publish"
                                data-id="${escapeHTML(test.id)}">
                                Publish Test
                            </button>
                        `
                    }
                `;

                testList.appendChild(card);

            });

        } catch (error) {

            console.error(error);

            message.textContent =
                'Unable to load mock tests: ' + error.message;

        }
    }

    async function viewTest(testId) {

        listSection.style.display = 'none';
        testDetails.style.display = 'block';

        detailsTitle.textContent = 'Loading test...';
        detailsStatus.textContent = '';
        detailsInfo.textContent = '';
        detailsMessage.textContent = 'Loading questions and answer key...';
        questionList.innerHTML = '';

        try {

            const { data: test, error: testError } = await supabase
                .from('pdf_mock_tests')
                .select('id, title, status, created_at')
                .eq('id', testId)
                .eq('teacher_id', currentUser.id)
                .single();

            if (testError) throw testError;

            const { data: questions, error: questionError } =
                await supabase
                    .from('pdf_mock_test_questions')
                    .select(`
                        id,
                        question_number,
                        question_text,
                        choices,
                        pdf_mock_test_answers (
                            correct_answer
                        )
                    `)
                    .eq('mock_test_id', testId)
                    .order('question_number', { ascending: true });

            if (questionError) throw questionError;

            detailsTitle.textContent = test.title;

            detailsStatus.textContent =
                test.status.toUpperCase();

            detailsStatus.className =
                'status ' + (test.status === 'published' ? 'published' : 'draft');

            detailsInfo.textContent =
                'Created: ' + new Date(test.created_at).toLocaleDateString();

            detailsMessage.textContent = '';

            if (!questions || questions.length === 0) {

                detailsMessage.textContent =
                    'No questions found for this mock test.';

                return;
            }

            questions.forEach(question => {

                const choices = question.choices || {};

                const answerRecord =
                    Array.isArray(question.pdf_mock_test_answers)
                        ? question.pdf_mock_test_answers[0]
                        : question.pdf_mock_test_answers;

                const correctAnswer =
                    answerRecord?.correct_answer || 'Not available';

                const questionCard = document.createElement('div');

                questionCard.className = 'question-card';

                let choicesHTML = '';

                ['A', 'B', 'C', 'D'].forEach(letter => {

                    const choiceText = choices[letter];

                    if (choiceText !== undefined && choiceText !== null) {

                        choicesHTML += `
                            <div class="choice">
                                <strong>${letter}.</strong>
                                ${escapeHTML(choiceText)}
                            </div>
                        `;

                    }

                });

                questionCard.innerHTML = `
                    <h4>
                        ${question.question_number}.
                        ${escapeHTML(question.question_text)}
                    </h4>

                    ${choicesHTML}

                    <p class="correct-answer">
                        Correct Answer: ${escapeHTML(correctAnswer)}
                    </p>
                `;

                questionList.appendChild(questionCard);

            });

        } catch (error) {

            console.error(error);

            detailsMessage.textContent =
                'Unable to load test details: ' + error.message;

        }
    }

    testList.addEventListener('click', async event => {

        const button = event.target.closest('button[data-action]');

        if (!button) return;

        const testId = button.dataset.id;
        const action = button.dataset.action;

        if (action === 'view') {

            await viewTest(testId);

            return;
        }

        if (action === 'publish') {

            if (!confirm('Are you sure you want to publish this mock test?')) {
                return;
            }

            button.disabled = true;
            button.textContent = 'Publishing...';

            try {

                const { error } = await supabase
                    .from('pdf_mock_tests')
                    .update({ status: 'published' })
                    .eq('id', testId)
                    .eq('teacher_id', currentUser.id);

                if (error) throw error;

                alert('Mock test published successfully!');

                await loadTests();

            } catch (error) {

                console.error(error);

                alert('Publishing failed: ' + error.message);

                button.disabled = false;
                button.textContent = 'Publish Test';

            }

        }

    });

    backButton.addEventListener('click', () => {

        testDetails.style.display = 'none';
        listSection.style.display = 'block';

        questionList.innerHTML = '';

    });

    refreshButton.addEventListener('click', loadTests);

    loadTests();

</script>

</body>
</html>
