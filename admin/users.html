
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHIQUE | User Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#f4f7f1;color:#263b30}
header{background:#193729;color:white;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:21px}
header p{font-size:12px;color:#dce8dc;margin-top:4px}
header a{color:white;text-decoration:none;font-size:12px}
main{max-width:1200px;margin:auto;padding:30px 20px}
.heading{margin-bottom:22px}
.heading h2{font-size:22px;color:#193729}
.heading p{font-size:12px;color:#829087;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.panel{background:#fffef8;border:1px solid #e7ece5;border-radius:14px;padding:20px}
.stat p{font-size:12px;color:#829087}
.stat h3{font-size:27px;color:#244b3a;margin-top:6px}
.panel{overflow:hidden}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
input,select{font-family:inherit;font-size:12px;padding:12px 14px;border:1px solid #dce5da;border-radius:9px;background:white;outline:none}
input{flex:1;min-width:200px}
select{min-width:150px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #e7ece5;font-size:12px}
th{color:#829087;font-weight:600;background:#f8faf5}
.role{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:600}
.student{background:#e8f1e7;color:#416b4c}
.teacher{background:#e9edf7;color:#52658d}
.admin{background:#f5ebd7;color:#98752d}
#message{font-size:12px;color:#829087;padding:20px 0;text-align:center}
@media(max-width:650px){.stats{grid-template-columns:1fr}.heading h2{font-size:19px}}
</style>
</head>

<body>
<header>
<div>
<h1>MATHIQUE | User Management</h1>
<p>Administrator Portal</p>
</div>
<a href="dashboard.html">← Back to Dashboard</a>
</header>

<main>
<section class="heading">
<h2>Registered Users</h2>
<p>View and monitor MATHIQUE student and teacher accounts.</p>
</section>

<section class="stats">
<div class="stat"><p>Total Users</p><h3 id="totalUsers">—</h3></div>
<div class="stat"><p>Students</p><h3 id="totalStudents">—</h3></div>
<div class="stat"><p>Teachers</p><h3 id="totalTeachers">—</h3></div>
</section>

<section class="panel">
<div class="controls">
<input id="searchInput" type="search" placeholder="Search by name or email...">
<select id="roleFilter">
<option value="all">All Roles</option>
<option value="student">Students</option>
<option value="teacher">Teachers</option>
<option value="admin">Administrators</option>
</select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Full Name</th>
<th>Email</th>
<th>Role</th>
</tr>
</thead>
<tbody id="usersTable"></tbody>
</table>
</div>
<div id="message">Loading users...</div>
</section>
</main>

<script type="module">
import { supabase } from '../js/supabase.js';

const table = document.getElementById('usersTable');
const message = document.getElementById('message');
const searchInput = document.getElementById('searchInput');
const roleFilter = document.getElementById('roleFilter');

let users = [];

function showMessage(text) {
    message.textContent = text;
    message.style.display = 'block';
}

function renderUsers() {
    const search = searchInput.value.toLowerCase().trim();
    const role = roleFilter.value;

    const filtered = users.filter(user => {
        const matchesSearch =
            (user.full_name || '').toLowerCase().includes(search) ||
            (user.email || '').toLowerCase().includes(search);

        const matchesRole = role === 'all' || user.role === role;
        return matchesSearch && matchesRole;
    });

    table.innerHTML = '';

    if (!filtered.length) {
        showMessage('No matching users found.');
        return;
    }

    message.style.display = 'none';

    filtered.forEach(user => {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = user.full_name || 'Not provided';

        const emailCell = document.createElement('td');
        emailCell.textContent = user.email || 'No email';

        const roleCell = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'role ' + user.role;
        badge.textContent = user.role;
        roleCell.appendChild(badge);

        row.append(nameCell, emailCell, roleCell);
        table.appendChild(row);
    });
}

async function loadUsers() {
    try {
        const { data: { session }, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
            showMessage('Please log in as an administrator.');
            return;
        }

        const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('role')
            .eq('user_id', session.user.id)
            .maybeSingle();

        if (profileError) throw profileError;

        if (!profile || profile.role !== 'admin') {
            showMessage('Admin access only.');
            return;
        }

        const { data, error } = await supabase
            .from('profiles')
            .select('user_id, full_name, email, role')
            .order('role', { ascending: true });

        if (error) throw error;

        users = data || [];

        document.getElementById('totalUsers').textContent = users.length;
        document.getElementById('totalStudents').textContent =
            users.filter(user => user.role === 'student').length;
        document.getElementById('totalTeachers').textContent =
            users.filter(user => user.role === 'teacher').length;

        renderUsers();

    } catch (error) {
        console.error(error);
        showMessage('Unable to load users: ' + error.message);
    }
}

searchInput.addEventListener('input', renderUsers);
roleFilter.addEventListener('change', renderUsers);

loadUsers();
</script>
</body>
</html>
