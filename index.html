<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>MATHIQUE | Login</title>

    <link rel="stylesheet" href="assets/css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

    <main class="login-page">

        <header class="brand">
            <h1>MATHIQUE</h1>
            <p>MATHEMATICS LEARNING DATABASE</p>
        </header>

        <section class="login-container">

            <h2>Welcome Back!</h2>
            <p class="subtitle">
                Enter your account to continue learning.
            </p>

            <form action="login.php" method="POST">

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <button type="submit">LOG IN</button>

            </form>

            <p class="login-footer">
                Learn • Explore • Solve
            </p>

        </section>

    </main>

</body>
</html>
